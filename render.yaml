services:
  - type: web
    name: call-tiffin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn OnlineTiffinManagement.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: call-tiffinwebapp.onrender.com
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: call-tiffin-db
          property: connectionString
databases:
  - name: call-tiffin-db
    plan: free
    databaseName: calltiffin
    user: calltiffin
